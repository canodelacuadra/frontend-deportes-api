<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <title>Login - Deportes Ayuntamiento</title>
    <style>

  <body>
    
    <div class="login-card container">
      <div class="logo-section">
        <span>🏛️</span>
        <h2>Portal Deportivo</h2>
        <p>Ayuntamiento Municipal</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" placeholder="ciudadano@ayto.es" required>
        </div>
        
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Tu contraseña" required>
        </div>

        <button type="submit">Iniciar Sesión</button>
      </form>

      <div id="errorMsg" class="error-msg"></div>

      <a href="/index.html" class="back-link">← Volver al escaparate público</a>
    </div>

    <a href="/index.html" class="back-link">← Volver al escaparate público</a>

      <a href="/registro.html" class="back-link" style="margin-top:10px; color:var(--secondary);">¿No tienes cuenta? Regístrate aquí</a>
    </div>
    <!-- Asegúrate de que tu lógica JS se llama así -->
    <script type="module" src="/src/login.js"></script>
  </body>
</html>
