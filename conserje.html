
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Conserje - Deportes</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
      .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 350px; text-align: center; border-top: 5px solid #e67e22; }
      h2 { color: #2c3e50; }
      input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; text-align: center; }
      button { width: 100%; padding: 12px; background: #e67e22; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; }
      button:hover { background: #d35400; }
      .result { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; }
      .valid { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
      .invalid { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>🛂 Portal del Conserje</h2>
      <p>Introduce el ID del ticket del ciudadano</p>
      
      <input type="number" id="ticketId" placeholder="Ej: 4" required>
      <button id="verifyBtn">Verificar Ticket</button>

      <div id="resultBox" class="result"></div>
    </div>

    <script type="module" src="/src/conserje.js"></script>
  </body>
</html>
