<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - Deportes Ayuntamiento</title>
    <style>
      /* Copiamos exactamente el mismo <style> que tienes en login.html */
      :root { --primary: #2c3e50; --secondary: #3498db; --danger: #e74c3c; --bg: #f4f7f6; --white: #ffffff; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg); background-image: radial-gradient(#dce1e0 1px, transparent 1px); background-size: 20px 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
      .login-card { background: var(--white); padding: 40px 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); width: 100%; max-width: 380px; border-top: 5px solid var(--primary); }
      .logo-section { text-align: center; margin-bottom: 30px; }
      .logo-section span { font-size: 50px; display: block; margin-bottom: 10px; }
      .logo-section h2 { color: var(--primary); font-size: 22px; font-weight: 600; }
      .logo-section p { color: #7f8c8d; font-size: 14px; margin-top: 5px; }
      .form-group { margin-bottom: 20px; }
      .form-group label { display: block; color: var(--primary); font-weight: bold; font-size: 14px; margin-bottom: 8px; }
      .form-group input { width: 100%; padding: 12px 15px; border: 1px solid #bdc3c7; border-radius: 6px; font-size: 15px; transition: border-color 0.3s, box-shadow 0.3s; color: #2c3e50; }
      .form-group input:focus { outline: none; border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2); }
      button[type="submit"] { width: 100%; padding: 14px; background-color: var(--secondary); color: var(--white); border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.3s, transform 0.1s; margin-top: 10px; }
      button[type="submit"]:hover { background-color: #2980b9; }
      button[type="submit"]:active { transform: scale(0.98); }
      .error-msg { color: var(--danger); text-align: center; margin-top: 15px; font-size: 14px; font-weight: bold; min-height: 20px; }
      .back-link { display: block; text-align: center; margin-top: 25px; color: #7f8c8d; text-decoration: none; font-size: 13px; transition: color 0.3s; }
      .back-link:hover { color: var(--primary); }
      .success-msg { color: #27ae60; text-align: center; margin-top: 15px; font-size: 14px; font-weight: bold; min-height: 20px; }
    </style>
  </head>
  <body>
    
    <div class="login-card">
      <div class="logo-section">
        <span>📝</span>
        <h2>Crear Cuenta</h2>
        <p>Regístrate como ciudadano</p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label for="nombre">Nombre Completo</label>
          <input type="text" id="nombre" placeholder="Ej: Ana García" required>
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" placeholder="ciudadano@ayto.es" required>
        </div>
        
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Mínimo 4 caracteres" required>
        </div>

        <button type="submit">Registrarme</button>
      </form>

      <div id="errorMsg" class="error-msg"></div>
      <div id="successMsg" class="success-msg"></div>

      <a href="/login.html" class="back-link">← Ya tengo cuenta. Iniciar sesión</a>
    </div>

    <script type="module" src="/src/registro.js"></script>
  </body>
</html>
